services:
  api:
    build: .
    command: 'node api.js'
    expose:
      - '3000'
    environment:
      - LEASE_SECRET
      - PAY_TO
      - FACILITATOR_URL
      - 'NETWORK=${NETWORK:-eip155:84532}'
      - DATABASE_URL=/data/leases.db
      - PEER_SOCKET=/data/ctrl/peer.sock
    volumes:
      - '/var/lib/seeder-402/leases.db:/data/leases.db'
      - '/var/lib/seeder-402/ctrl:/data/ctrl'
    depends_on:
      - peer
    restart: unless-stopped
    labels:
      - "traefik.http.middlewares.hsts.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.routers.https-0-odc1xtfxvsx486yh6mzudjsp-api-8a5d.middlewares=hsts"
  peer:
    build: .
    command: 'node peer.js'
    network_mode: host
    environment:
      - STORE=/data/corestore
      - CONTROL_SOCKET=/data/ctrl/peer.sock
    volumes:
      - '/var/lib/seeder-402/corestore:/data/corestore'
      - '/var/lib/seeder-402/ctrl:/data/ctrl'
    restart: unless-stopped
